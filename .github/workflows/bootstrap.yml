name: Install Radar de Grupos source files
on:
  push:
    branches: [main]
    paths:
      - '.radar-source-package.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract prepared project
        run: |
          base64 --decode .radar-source-package.b64 | tar -xJf -
          rm .radar-source-package.b64
      - name: Commit all source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: complete Radar de Grupos MVP with Facebook discovery"
            git push origin main
          fi
