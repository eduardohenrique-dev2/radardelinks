services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - radar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD}@db:5432/radar
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Configure ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      MAX_SEARCH_REQUESTS: ${MAX_SEARCH_REQUESTS:-9}
      MAX_SEARCH_RESULTS: ${MAX_SEARCH_RESULTS:-20}
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  radar_postgres:
